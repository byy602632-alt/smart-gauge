<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070c">
  <title>Smart Gauge — มือถือ (Bluetooth & Wi‑Fi)</title>
  <style>
    :root {
      --bg: #05070c; --panel: #0b1119; --panel2: #0e1622; --line: #1a2836;
      --text: #d9e4ee; --dim: #5d7085;
      --cyan: #00e5ff; --green: #00e676; --amber: #ffb300; --red: #ff3d3d;
      --mono: Consolas, SF Mono, ui-monospace, Courier New, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; }
    body {
      background: var(--bg);
      background-image: radial-gradient(900px 420px at 50% -8%, rgba(0,229,255,.10), transparent 65%);
      color: var(--text);
      font-family: Segoe UI, Tahoma, system-ui, sans-serif;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .wrap { max-width: 520px; margin: 0 auto; padding: 12px 12px 40px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .brand { font-size: 15px; font-weight: 700; letter-spacing: 2px; color: var(--cyan); }
    .brand small { display: block; font-size: 9px; letter-spacing: 1.5px; color: var(--dim); font-weight: 400; }
    .spacer { flex: 1; }
    .pill {
      display: flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 1px;
      padding: 6px 10px; border: 1px solid var(--line); border-radius: 99px; background: var(--panel);
      color: var(--dim); white-space: nowrap;
    }
    .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); box-shadow: 0 0 6px currentColor; }
    .pill.on { color: var(--green); border-color: #124a2e; }
    .pill.on .dot { background: var(--green); animation: blink 1.1s infinite; }
    .pill.warn { color: var(--amber); border-color: #4a3a12; }
    .pill.warn .dot { background: var(--amber); animation: blink .6s infinite; }
    .pill.err { color: var(--red); border-color: #4a1519; }
    .pill.err .dot { background: var(--red); }
    @keyframes blink { 50% { opacity: .25; } }
    .btn {
      font: inherit; font-size: 12px; font-weight: 600; letter-spacing: .5px; cursor: pointer;
      padding: 9px 14px; border-radius: 10px; border: 1px solid #0c5f6b; background: #062b33; color: var(--cyan);
    }
    .btn:active { transform: scale(.97); }
    .btn.ghost { background: transparent; border-color: var(--line); color: var(--dim); }
    .card {
      background: linear-gradient(180deg, #0d1521, #080d15);
      border: 1px solid var(--line); border-radius: 16px; position: relative; overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
    }
    .hero { display: flex; align-items: center; gap: 6px; padding: 10px 8px 6px; }
    .gaugeBox { flex: 1 1 auto; min-width: 0; text-align: center; }
    .gaugeBox svg { width: 100%; max-width: 250px; height: auto; display: block; margin: 0 auto; overflow: visible; }
    .speedCol { flex: 0 0 40%; max-width: 40%; text-align: center; padding: 6px 4px 10px; border-left: 1px solid var(--line); }
    .speedCol .k { font-size: 9px; letter-spacing: 4px; color: var(--dim); }
    .speedCol .n { font-family: var(--mono); font-size: 66px; font-weight: 700; line-height: 66px; color: #fff; text-shadow: 0 0 18px rgba(0,229,255,.6); letter-spacing: -2px; }
    .speedCol .u { font-size: 11px; letter-spacing: 5px; color: var(--cyan); margin-top: -2px; }
    .mini { display: flex; justify-content: center; gap: 14px; margin-top: 10px; font-size: 11px; color: var(--dim); }
    .mini b { font-family: var(--mono); font-weight: 700; color: var(--green); }
    .mini b.max { color: var(--cyan); }
    .speedBar { display: flex; gap: 2px; height: 10px; margin: 12px 8px 4px; }
    .speedBar i { flex: 1; border-radius: 2px; background: #132130; }
    .haz { height: 8px; margin: 0 8px 10px; background: repeating-linear-gradient(45deg, #ede700 0 6px, #0b1119 6px 12px); opacity: .75; border-radius: 2px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .tile {
      background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--acc, #00e5ff);
      border-radius: 12px; padding: 9px 10px 10px; position: relative; overflow: hidden;
    }
    .tile .top { display: flex; align-items: baseline; justify-content: space-between; }
    .tile .lab { font-size: 11px; letter-spacing: 2px; font-weight: 700; color: var(--acc); }
    .tile .un { font-size: 9px; color: var(--dim); letter-spacing: .5px; }
    .tile .val {
      font-family: var(--mono); font-size: 34px; font-weight: 700; line-height: 40px; color: var(--green);
      text-align: center; text-shadow: 0 0 10px rgba(0,230,118,.35); letter-spacing: -1px;
    }
    .tile .val.warn { color: var(--amber); text-shadow: 0 0 10px rgba(255,179,0,.4); }
    .tile .val.bad { color: var(--red); text-shadow: 0 0 10px rgba(255,61,61,.45); }
    .tile .val.cool { color: var(--cyan); text-shadow: 0 0 10px rgba(0,229,255,.4); }
    .tile .bar { display: flex; gap: 2px; height: 7px; margin-top: 6px; }
    .tile .bar i { flex: 1; border-radius: 1px; background: #152232; }
    .tile .rng { display: flex; justify-content: space-between; font-size: 9px; color: #3f5165; margin-top: 4px; font-family: var(--mono); }
    body.stale .tile .val, body.stale .speedCol .n, body.stale .gaugeBox svg { opacity: .35; filter: grayscale(.7); }
    .info { margin-top: 16px; font-size: 11.5px; line-height: 1.75; color: var(--dim); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; }
    .info b { color: var(--text); }
    .info code { font-family: var(--mono); color: var(--cyan); background: #0a1620; padding: 1px 5px; border-radius: 5px; font-size: 11px; word-break: break-all; }
    .info h4 { font-size: 11px; letter-spacing: 2px; color: var(--cyan); margin-bottom: 6px; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.62); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: .2s; z-index: 40; }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-width: 520px; margin: 0 auto;
      background: #0a111a; border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0;
      padding: 8px 16px calc(20px + env(safe-area-inset-bottom));
      transform: translateY(105%); transition: transform .25s cubic-bezier(.2,.8,.2,1);
    }
    .sheet.open { transform: none; }
    .grab { width: 44px; height: 4px; border-radius: 9px; background: #22303f; margin: 6px auto 12px; }
    .sheet h3 { font-size: 13px; letter-spacing: 2px; color: var(--cyan); margin-bottom: 10px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; }
    .tabs button { flex: 1 1 auto; font: inherit; font-size: 12px; padding: 9px 4px; border-radius: 10px; cursor: pointer; background: transparent; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
    .tabs button.active { background: #062b33; border-color: #0c5f6b; color: var(--cyan); font-weight: 700; }
    .pane { display: none; }
    .pane.show { display: block; }
    label { display: block; font-size: 11px; letter-spacing: 1px; color: var(--dim); margin: 10px 0 5px; }
    input[type=text] {
      width: 100%; font: inherit; font-family: var(--mono); font-size: 13px; color: var(--text);
      background: #070d14; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; outline: none;
    }
    input[type=text]:focus { border-color: #0c5f6b; }
    .row { display: flex; gap: 8px; margin-top: 14px; }
    .row .btn { flex: 1; padding: 12px; }
    .hint { font-size: 11px; line-height: 1.7; color: var(--dim); margin-top: 10px; }
    .statusline { font-family: var(--mono); font-size: 11.5px; color: var(--dim); margin-top: 12px; min-height: 16px; word-break: break-all; }
    .statusline.ok { color: var(--green); } .statusline.err { color: var(--red); }
    .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 60; background: #0d1a24; border: 1px solid #0c5f6b; color: var(--cyan); font-size: 12px; padding: 9px 16px; border-radius: 99px; opacity: 0; pointer-events: none; max-width: 92vw; text-align: center; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">SMART GAUGE<small>TELEMETRY • BLUETOOTH + WI-FI</small></div>
      <div class="spacer"></div>
      <div class="pill" id="connPill"><span class="dot"></span><span id="connText">ไม่ได้เชื่อมต่อ</span></div>
      <button class="btn ghost" id="fsBtn" title="เต็มจอ">⛶</button>
      <button class="btn" id="openSheet">เชื่อมต่อ</button>
    </header>
    <section class="card">
      <div class="hero">
        <div class="gaugeBox">
          <svg viewBox="0 0 240 160">
            <path id="rpmTrack" fill="none" stroke="#132130" stroke-width="14" stroke-linecap="round"></path>
            <path id="rpmRed" fill="none" stroke="#3a1013" stroke-width="14" stroke-linecap="round"></path>
            <path id="rpmArc" fill="none" stroke="#00e5ff" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"></path>
            <g id="rpmTicks" stroke="#33465a" stroke-width="2"></g>
            <line id="rpmNeedle" x1="120" y1="112" x2="120" y2="34" stroke="#ff3d3d" stroke-width="3" stroke-linecap="round"></line>
            <text id="rpmVal" x="120" y="116" text-anchor="middle" font-size="44" font-weight="700" font-family="Consolas, monospace" fill="#fff">0</text>
            <text x="120" y="140" text-anchor="middle" font-size="11" letter-spacing="5" font-family="Segoe UI, sans-serif" fill="#5d7085">RPM</text>
            <circle cx="120" cy="112" r="5" fill="#0b1119" stroke="#33465a" stroke-width="2"></circle>
          </svg>
        </div>
        <div class="speedCol">
          <div class="k">ความเร็ว</div>
          <div class="n" id="spdVal">0</div>
          <div class="u">KM / H</div>
          <div class="mini">
            <span>AVG <b id="spdAvg">0</b></span>
            <span>MAX <b class="max" id="spdMax">0</b></span>
          </div>
        </div>
      </div>
      <div class="speedBar" id="spdBar"></div>
      <div class="haz"></div>
    </section>
    <section class="grid" id="grid"></section>
  </div>
  <div class="overlay" id="overlay"></div>
  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <h3>เชื่อมต่ออุปกรณ์</h3>
    <div class="tabs">
      <button class="active" data-tab="ble">BLE</button>
      <button data-tab="wifi">Wi‑Fi</button>
      <button data-tab="demo">Demo</button>
    </div>
    <div class="pane show" id="pane-ble">
      <div id="bleSupport" class="hint"></div>
      <label>SERVICE UUID</label>
      <input type="text" id="svcUUID" value="0000ffe0-0000-1000-8000-00805f9b34fb">
      <label>CHARACTERISTIC UUID (notify)</label>
      <input type="text" id="chrUUID" value="0000ffe1-0000-1000-8000-00805f9b34fb">
      <div class="row">
        <button class="btn" id="bleConnect">สแกน + เชื่อมต่อ</button>
        <button class="btn ghost" id="bleDisconnect">ตัดการเชื่อมต่อ</button>
      </div>
      <div class="statusline" id="bleStatus"></div>
    </div>
    <div class="pane" id="pane-wifi">
      <label>WebSocket URL</label>
      <input type="text" id="wsURL" value="ws://192.168.4.1/">
      <div class="row">
        <button class="btn" id="wsConnect">เชื่อมต่อ Wi‑Fi</button>
        <button class="btn ghost" id="wsDisconnect">ตัดการเชื่อมต่อ</button>
      </div>
      <div class="statusline" id="wsStatus"></div>
    </div>
    <div class="pane" id="pane-demo">
      <div class="hint">โหมดจำลองข้อมูลสำหรับทดสอบหน้าจอ</div>
      <div class="row">
        <button class="btn" id="demoStart">เริ่ม Demo</button>
        <button class="btn ghost" id="demoStop">หยุด</button>
      </div>
      <div class="statusline" id="demoStatus"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    'use strict';
    const TILES = [
      {key:'afr', label:'AFR', un:'ratio', min:10, max:18, dec:1, color:'#00e5ff', clamp:[0,30]},
      {key:'tps', label:'TPS', un:'%', min:0, max:100, dec:0, color:'#ff00ff', clamp:[0,100]},
      {key:'temp', label:'TEMP', un:'°C', min:0, max:120, dec:0, color:'#ffb300', clamp:[-40,250]},
      {key:'bat', label:'BAT', un:'V', min:10, max:15, dec:1, color:'#c4ff00', clamp:[0,20]}
    ];
    const grid = document.getElementById('grid');
    TILES.forEach(t => {
      const el = document.createElement('div');
      el.className = 'tile';
      el.style.setProperty('--acc', t.color);
      el.innerHTML = '<div class="top"><span class="lab">'+t.label+'</span><span class="un">'+t.un+'</span></div><div class="val" id="v_'+t.key+'">–</div><div class="bar" id="b_'+t.key+'"></div>';
      grid.appendChild(el);
      const bar = el.querySelector('.bar');
      for (let i = 0; i < 12; i++) bar.appendChild(document.createElement('i'));
    });
    const spdBarEl = document.getElementById('spdBar');
    for (let i = 0; i < 20; i++) spdBarEl.appendChild(document.createElement('i'));

    const data = {rpm:0, speed:0, afr:14.7, tps:0, bat:12.6, temp:20};
    let lastUpdate = 0, hadData = false, spdMax = 0, spdAvg = 0;
    const fmt = (v, dec) => dec ? Number(v).toFixed(dec) : String(Math.round(v));
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

    function ingestObject(obj) {
      for (const k in data) {
        if (obj[k] !== undefined) data[k] = Number(obj[k]) || 0;
      }
      lastUpdate = performance.now(); hadData = true;
    }
    function ingest(text) {
      try { ingestObject(JSON.parse(text)); } catch(e) {}
    }

    const CX = 120, CY = 112, R = 94, A0 = -110, A1 = 110;
    const rpmArc = document.getElementById('rpmArc');
    document.getElementById('rpmTrack').setAttribute('d', 'M ' + (CX + R * Math.cos((A0-90)*Math.PI/180)) + ' ' + (CY + R * Math.sin((A0-90)*Math.PI/180)));
    
    function render() {
      document.getElementById('rpmVal').textContent = Math.round(data.rpm);
      const rp = clamp(data.rpm / 8000, 0, 1);
      rpmArc.setAttribute('stroke-dasharray', (rp * 100).toFixed(2) + ' 100');
      document.getElementById('spdVal').textContent = Math.round(data.speed);
      TILES.forEach(t => {
        document.getElementById('v_' + t.key).textContent = fmt(data[t.key], t.dec);
      });
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    let bleDevice = null, bleChar = null, bleLineBuf = '';
    async function bleConnect() {
      if (!navigator.bluetooth) { alert('เบราว์เซอร์ไม่รองรับ Web Bluetooth'); return; }
      try {
        const svc = document.getElementById('svcUUID').value.trim();
        const chr = document.getElementById('chrUUID').value.trim();
        bleDevice = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: [svc] });
        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(svc);
        bleChar = await service.getCharacteristic(chr);
        await bleChar.startNotifications();
        bleChar.addEventListener('characteristicvaluechanged', (ev) => {
          ingest(new TextDecoder().decode(ev.target.value));
        });
        document.getElementById('connPill').className = 'pill on';
        document.getElementById('connText').textContent = 'เชื่อมต่อแล้ว';
      } catch(err) {
        alert('เชื่อมต่อไม่สำเร็จ: ' + err);
      }
    }
    document.getElementById('bleConnect').addEventListener('click', bleConnect);
    
    const sheet = document.getElementById('sheet'), overlay = document.getElementById('overlay');
    document.getElementById('openSheet').addEventListener('click', () => { sheet.classList.add('open'); overlay.classList.add('open'); });
    overlay.addEventListener('click', () => { sheet.classList.remove('open'); overlay.classList.remove('open'); });
    document.querySelectorAll('.tabs button').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        document.querySelectorAll('.pane').forEach(p => p.classList.remove('show'));
        document.getElementById('pane-' + b.dataset.tag || b.dataset.tab).classList.add('show');
      });
    });
  </script>
</body>
</html>
